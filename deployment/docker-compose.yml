version: '3.8'

services:
  # Database
  postgres:
    image: postgres:14
    container_name: fraud_detection_postgres
    environment:
      POSTGRES_USER: fraud_detection
      POSTGRES_PASSWORD: fraud_detection_password
      POSTGRES_DB: fraud_detection
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    networks:
      - fraud_detection_network

  # Redis for caching and message broker
  redis:
    image: redis:7
    container_name: fraud_detection_redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - fraud_detection_network

  # API Gateway
  api_gateway:
    build:
      context: ../services/api_gateway
      dockerfile: Dockerfile
    container_name: fraud_detection_api_gateway
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql://fraud_detection:fraud_detection_password@postgres:5432/fraud_detection
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=api_gateway_secret_key
      - DEBUG=False
      - ALLOWED_HOSTS=*
    ports:
      - "8000:8000"
    restart: always
    networks:
      - fraud_detection_network

  # Signal Service
  signal_service:
    build:
      context: ../services/signal_service
      dockerfile: Dockerfile
    container_name: fraud_detection_signal_service
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql://fraud_detection:fraud_detection_password@postgres:5432/fraud_detection
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=signal_service_secret_key
      - DEBUG=False
    restart: always
    networks:
      - fraud_detection_network

  # Transaction API Service
  transaction_api:
    build:
      context: ../services/transaction_api
      dockerfile: Dockerfile
    container_name: fraud_detection_transaction_api
    depends_on:
      - postgres
      - redis
      - signal_service
    environment:
      - DATABASE_URL=postgresql://fraud_detection:fraud_detection_password@postgres:5432/fraud_detection
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=transaction_api_secret_key
      - DEBUG=False
      - SIGNAL_SERVICE_URL=http://signal_service:8000
    restart: always
    networks:
      - fraud_detection_network

  # Block Service
  block_service:
    build:
      context: ../services/block_service
      dockerfile: Dockerfile
    container_name: fraud_detection_block_service
    depends_on:
      - postgres
      - redis
      - signal_service
    environment:
      - DATABASE_URL=postgresql://fraud_detection:fraud_detection_password@postgres:5432/fraud_detection
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=block_service_secret_key
      - DEBUG=False
      - SIGNAL_SERVICE_URL=http://signal_service:8000
    restart: always
    networks:
      - fraud_detection_network

  # Rule Service
  rule_service:
    build:
      context: ../services/rule_service
      dockerfile: Dockerfile
    container_name: fraud_detection_rule_service
    depends_on:
      - postgres
      - redis
      - signal_service
    environment:
      - DATABASE_URL=postgresql://fraud_detection:fraud_detection_password@postgres:5432/fraud_detection
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=rule_service_secret_key
      - DEBUG=False
      - SIGNAL_SERVICE_URL=http://signal_service:8000
    restart: always
    networks:
      - fraud_detection_network

  # Velocity Service
  velocity_service:
    build:
      context: ../services/velocity_service
      dockerfile: Dockerfile
    container_name: fraud_detection_velocity_service
    depends_on:
      - postgres
      - redis
      - signal_service
    environment:
      - DATABASE_URL=postgresql://fraud_detection:fraud_detection_password@postgres:5432/fraud_detection
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=velocity_service_secret_key
      - DEBUG=False
      - SIGNAL_SERVICE_URL=http://signal_service:8000
    restart: always
    networks:
      - fraud_detection_network

  # ML Service
  ml_service:
    build:
      context: ../services/ml_service
      dockerfile: Dockerfile
    container_name: fraud_detection_ml_service
    depends_on:
      - postgres
      - redis
      - signal_service
    environment:
      - DATABASE_URL=postgresql://fraud_detection:fraud_detection_password@postgres:5432/fraud_detection
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=ml_service_secret_key
      - DEBUG=False
      - SIGNAL_SERVICE_URL=http://signal_service:8000
    restart: always
    networks:
      - fraud_detection_network

  # AML Service
  aml_service:
    build:
      context: ../services/aml_service
      dockerfile: Dockerfile
    container_name: fraud_detection_aml_service
    depends_on:
      - postgres
      - redis
      - signal_service
    environment:
      - DATABASE_URL=postgresql://fraud_detection:fraud_detection_password@postgres:5432/fraud_detection
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=aml_service_secret_key
      - DEBUG=False
      - SIGNAL_SERVICE_URL=http://signal_service:8000
    restart: always
    networks:
      - fraud_detection_network

  # Response Service
  response_service:
    build:
      context: ../services/response_service
      dockerfile: Dockerfile
    container_name: fraud_detection_response_service
    depends_on:
      - postgres
      - redis
      - signal_service
    environment:
      - DATABASE_URL=postgresql://fraud_detection:fraud_detection_password@postgres:5432/fraud_detection
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=response_service_secret_key
      - DEBUG=False
      - SIGNAL_SERVICE_URL=http://signal_service:8000
    restart: always
    networks:
      - fraud_detection_network

  # Admin Portal Frontend
  admin_portal:
    build:
      context: ../frontend/admin_portal
      dockerfile: Dockerfile
    container_name: fraud_detection_admin_portal
    ports:
      - "3000:80"
    restart: always
    networks:
      - fraud_detection_network

  # Analyst Portal Frontend
  analyst_portal:
    build:
      context: ../frontend/analyst_portal
      dockerfile: Dockerfile
    container_name: fraud_detection_analyst_portal
    ports:
      - "3001:80"
    restart: always
    networks:
      - fraud_detection_network

  # Compliance Portal Frontend
  compliance_portal:
    build:
      context: ../frontend/compliance_portal
      dockerfile: Dockerfile
    container_name: fraud_detection_compliance_portal
    ports:
      - "3002:80"
    restart: always
    networks:
      - fraud_detection_network

networks:
  fraud_detection_network:
    driver: bridge

volumes:
  postgres_data:
